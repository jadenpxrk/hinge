<svg xmlns="http://www.w3.org/2000/svg" width="960" height="256" viewBox="0 0 960 256" role="img" aria-labelledby="title description">
  <title id="title">One gesture. One lid-close session.</title>
  <desc id="description">Hold Option as you close your MacBook. The Mac stays awake with its screen off. Open the lid to end the session.</desc>
  <rect width="960" height="256" rx="20" fill="#111827"/>
  <g stroke="#334155" stroke-width="1">
    <path d="M320 32v192M640 32v192"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">
      <text x="160" y="36">01 / CLOSE</text>
      <text x="480" y="36">02 / KEEP WORKING</text>
      <text x="800" y="36">03 / OPEN</text>
    </g>
    <g fill="none" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 142h96l-74-66M92 150h108"/>
      <path d="M424 135h112M420 145h120"/>
      <path d="M745 142h108l-43-79M741 150h120"/>
    </g>
    <circle cx="480" cy="104" r="7" fill="#ffb340"/>
    <rect x="209" y="104" width="46" height="34" rx="8" fill="#263142" stroke="#475569"/>
    <text x="232" y="128" fill="#ffb340" font-size="25">⌥</text>
    <g fill="#f1f5f9" font-size="18" font-weight="600">
      <text x="160" y="194">Hold Option + close</text>
      <text x="480" y="194">Screen off. Mac awake.</text>
      <text x="800" y="194">Open to end the session</text>
    </g>
    <g fill="#94a3b8" font-size="13">
      <text x="160" y="219">Start from an open lid</text>
      <text x="480" y="219">Let your work keep running</text>
      <text x="800" y="219">Normal lid sleep returns</text>
    </g>
  </g>
</svg>
